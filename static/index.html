<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fbfaf6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131210" media="(prefers-color-scheme: dark)">
<title>Keto log</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main class="app">
  <div class="tabs" id="tabs" role="tablist" aria-label="View"></div>
  <section id="insights" aria-label="Insights"></section>
  <nav class="nav" id="nav" aria-label="Day"></nav>
  <section class="glance is-under" id="glance" aria-label="Day at a glance">
    <p class="eyebrow net-label">Net carbs</p>
    <p class="hero"><span><span class="hero-num num">0</span><span class="hero-goal">/ 20 g</span></span></p>
  </section>
  <section id="quick" aria-label="Log again"></section>
  <section id="log" aria-label="Entries"></section>
  <section class="more" id="more" aria-label="Week, fasting and body"></section>
  <footer class="foot">
    <p><button type="button" class="link" data-act="import-open">Import from sheet</button></p>
    <p>Export CSV:
    <a class="link" href="/api/export.csv?table=entries">entries</a> ·
    <a class="link" href="/api/export.csv?table=fasts">fasts</a> ·
    <a class="link" href="/api/export.csv?table=measurements">measurements</a> ·
    <a class="link" href="/api/export.csv?table=body">water</a></p>
  </footer>
</main>

<div class="pinbar" id="pinbar"></div>
<div id="sheet"></div>
<div id="toast" aria-live="polite"></div>

<script src="/static/app.js"></script>
</body>
</html>
